name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          # node strategy: bumps package.json, maintains CHANGELOG.md,
          # tags the release commit, and creates a GitHub Release.
          release-type: node
